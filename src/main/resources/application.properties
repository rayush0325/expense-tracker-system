spring.application.name=expense-tracker-system

spring.datasource.url = jdbc:mysql://127.0.0.1:3306/expense_tracker_dev
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

spring.database.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
